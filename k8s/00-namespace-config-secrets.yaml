apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  CURRENCY: "USD"
  NODE_ENV: "production"
  PAYOPS_API_URL: "http://payops-backend.payops.svc.cluster.local:3000"
  PAYOPS_MODE: "live"
  RECONCILE_INTERVAL_MS: "120000"
  PENDING_ORDER_TIMEOUT_MINUTES: "30"
  AUTH_SERVICE_PORT: "4004"
  PRODUCT_SERVICE_PORT: "4002"
  CART_SERVICE_PORT: "4003"
  ORDER_SERVICE_PORT: "4001"
  SEARCH_SERVICE_PORT: "4005"
  FRONTEND_PORT: "5173"
---
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  PAYOPS_API_KEY: "sk_live_replace_with_vault_secret"
  PAYOPS_WEBHOOK_SECRET: "whsec_live_replace_with_vault_secret"
  JWT_SECRET: "replace_with_strong_jwt_secret"
  DATABASE_URL: "postgres://ecommerce:ecommerce_secret@ecommerce-postgres.ecommerce.svc.cluster.local:5432/ecommerce"
  REDIS_URL: "redis://ecommerce-redis.ecommerce.svc.cluster.local:6379"
