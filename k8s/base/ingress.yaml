apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payops-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
    - http:
        paths:
          - path: /api/payments
            pathType: Prefix
            backend:
              service:
                name: payops-api
                port:
                  number: 3000
          - path: /api/invoices
            pathType: Prefix
            backend:
              service:
                name: payops-api
                port:
                  number: 3000
          - path: /api/billing
            pathType: Prefix
            backend:
              service:
                name: payops-api
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payops-api
                port:
                  number: 3000
