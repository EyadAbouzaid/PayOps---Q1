apiVersion: apps/v1
kind: Deployment
metadata:
  name: payops-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payops-api
  template:
    metadata:
      labels:
        app: payops-api
    spec:
      containers:
        - name: api
          image: 950219439587.dkr.ecr.eu-north-1.amazonaws.com/payops:latest
          ports:
            - containerPort: 3000
          env:
            - name: ENABLE_EMBEDDED_WORKER
              value: "false"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payops-api
spec:
  selector:
    app: payops-api
  ports:
    - port: 3000
      targetPort: 3000
